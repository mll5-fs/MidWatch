name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate current OUATventure roster
        run: node scripts/generate-ouat-snapshot.mjs

      - name: Build MidWatch 2.2.0
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: MidWatch-Windows-Installer
          path: dist/MidWatch-Setup-2.2.0.exe

      - name: Publish MidWatch 2.2.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.2.0"
          $exe = "dist/MidWatch-Setup-2.2.0.exe"

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if ($releaseExists) {
            git tag -f $tag "${{ github.sha }}"
            git push origin "refs/tags/$tag" --force
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --target "${{ github.sha }}" --title "MidWatch 2.2.0.1" --notes "Major visual redesign with a refined glass interface, clearer live states, global search, DPM links for pro and OUAT players, Riot ID correction and bundled OUATventure rosters."
          }
