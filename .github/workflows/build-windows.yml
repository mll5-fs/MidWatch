name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate current OUATventure roster
        run: node scripts/generate-ouat-snapshot.mjs
      - name: Validate JavaScript syntax
        run: node scripts/check-syntax.mjs
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build MidPulse
        run: npm run dist
      - name: Verify embedded team scouting and release version
        run: node scripts/verify-packaged.cjs
      - name: Inspect actual installer payload
        shell: pwsh
        run: |
          7z x "dist/MidPulse-Setup-${{ steps.version.outputs.value }}.exe" -overify-installer -y
          if ($LASTEXITCODE -ne 0) { throw "Installer extraction failed" }
          $payload = Get-ChildItem verify-installer -Recurse -Filter app-64.7z | Select-Object -First 1
          if (-not $payload) { throw "Electron installer payload missing" }
          7z x $payload.FullName -overify-payload -y
          if ($LASTEXITCODE -ne 0) { throw "Payload extraction failed" }
          node scripts/verify-packaged.cjs verify-payload/resources/app.asar
          if ($LASTEXITCODE -ne 0) { throw "Installer content verification failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: MidPulse-Windows-Installer
          path: dist/MidPulse-Setup-${{ steps.version.outputs.value }}.exe
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          $exe = "dist/MidPulse-Setup-$version.exe"
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"
          if ($exists) {
            Write-Host "Release $tag already exists. Preserving its installer; bump package.json to publish changes."
          } else {
            gh release create $tag $exe --target "${{ github.sha }}" --title "MidPulse $version" --notes "Statistiques OUAT : les compteurs numeriques omis sont normalises a zero selon la convention officielle Riot, sans accepter les valeurs nulles ou invalides. Provenance et nombre de champs/parties concernes dans les rapports, filtres et export. Collecteur patch MID partage avec les cinq roles ; nouveaux caches pour recollecter. Contenu Electron de cet installateur inspecte automatiquement ; aucun essai dans un client LoL reel. Source commit: ${{ github.sha }}."
            if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
          }
