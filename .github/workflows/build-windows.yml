name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate current OUATventure roster
        run: node scripts/generate-ouat-snapshot.mjs
      - name: Build MidPulse 3.1.1
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MidPulse-Windows-Installer
          path: dist/MidPulse-Setup-3.1.1.exe
      - name: Publish MidPulse 3.1.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v3.1.1"
          $exe = "dist/MidPulse-Setup-3.1.1.exe"
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"
          if ($exists) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --target "${{ github.sha }}" --title "MidPulse 3.1.1.1" --notes "OUAT ergonomics overhaul, direct DPM account links, plus LCK CL and LFL midlaners."
          }
