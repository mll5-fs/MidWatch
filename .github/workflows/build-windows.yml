name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate current OUATventure roster
        run: node scripts/generate-ouat-snapshot.mjs
      - name: Validate JavaScript syntax
        run: node scripts/check-syntax.mjs
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build MidPulse
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MidPulse-Windows-Installer
          path: dist/MidPulse-Setup-${{ steps.version.outputs.value }}.exe
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          $exe = "dist/MidPulse-Setup-$version.exe"
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"
          if ($exists) {
            Write-Host "Release $tag already exists. Preserving its installer; bump package.json to publish changes."
          } else {
            gh release create $tag $exe --target "${{ github.sha }}" --title "MidPulse $version" --notes "Scouting OUATventure : rangs SoloQ, lane a 10 minutes, habitudes de debut de partie, matchups mid et analyses par patch avec taille d'echantillon. Source commit: ${{ github.sha }}."
            if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
          }
